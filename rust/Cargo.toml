[workspace]
members = [
  "crates/aetower-time",
  "crates/aetower-model",
  "crates/aetower-collector",
  "crates/aetower-identity",
  "crates/aetower-attribution",
  "crates/aetower-friction",
  "crates/aetower-history",
  "crates/aetower-gpu",
  "crates/aetower-persistence",
  "crates/aetower-fleet",
  "crates/aetower-telemetry",
  "crates/aetower-core",
  "crates/aetower-ffi",
  "crates/aetower-helper",
  "crates/aetower-bench",
  "crates/uniffi-bindgen-swift",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
anyhow = "1"
parking_lot = "0.12"
uniffi = { version = "0.29", features = ["cli"] }
core-foundation-sys = "0.8.7"
