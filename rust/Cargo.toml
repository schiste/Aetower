[workspace]
members = [
  "crates/aetower-time",
  "crates/aetower-model",
  "crates/aetower-collector",
  "crates/aetower-identity",
  "crates/aetower-attribution",
  "crates/aetower-friction",
  "crates/aetower-history",
  "crates/aetower-gpu",
  "crates/aetower-persistence",
  "crates/aetower-diagnostics",
  "crates/aetower-sensors",
  "crates/aetower-telemetry",
  "crates/aetower-policy",
  "crates/aetower-reputation",
  "crates/aetower-regression",
  "crates/aetower-core",
  "crates/aetower-ffi",
  "crates/aetower-mcp",
  "crates/aetower-helper",
  "crates/aetower-bench",
  "crates/uniffi-bindgen-swift",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "disk", "user"] }
anyhow = "1"
parking_lot = "0.12"
uniffi = { version = "0.29", default-features = false }
core-foundation-sys = "0.8.7"
smallvec = { version = "1", features = ["serde"] }
ureq = "3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
rhai = { version = "1.19", default-features = false, features = ["std", "sync"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# panic stays "unwind": uniffi converts Rust panics into Swift-visible errors via
# catch_unwind at the FFI boundary; panic = "abort" would kill the host app instead.
