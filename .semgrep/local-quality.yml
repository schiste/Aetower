rules:
  - id: swift-no-anyview
    message: Avoid AnyView in app code.
    severity: ERROR
    languages: [swift]
    paths:
      include:
        - macos/Sources/AetowerUI/**/*.swift
        - macos/Sources/AetowerApp/**/*.swift
        - macos/Sources/AetowerBridge/**/*.swift
    pattern-regex: "\\bAnyView\\b"

  - id: swift-no-fatal-error
    message: Avoid fatalError in production app code.
    severity: ERROR
    languages: [swift]
    paths:
      include:
        - macos/Sources/AetowerUI/**/*.swift
        - macos/Sources/AetowerApp/**/*.swift
        - macos/Sources/AetowerBridge/**/*.swift
    pattern-regex: "\\bfatalError\\("

  - id: swift-no-force-cast
    message: Avoid force casts in app code.
    severity: ERROR
    languages: [swift]
    paths:
      include:
        - macos/Sources/AetowerUI/**/*.swift
        - macos/Sources/AetowerApp/**/*.swift
        - macos/Sources/AetowerBridge/**/*.swift
    pattern-regex: "\\bas!\\b"

  - id: swift-no-force-try
    message: Avoid try! in app code.
    severity: ERROR
    languages: [swift]
    paths:
      include:
        - macos/Sources/AetowerUI/**/*.swift
        - macos/Sources/AetowerApp/**/*.swift
        - macos/Sources/AetowerBridge/**/*.swift
    pattern-regex: "\\btry!\\b"

  - id: rust-no-todo-macro
    message: Do not commit todo! placeholders.
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - rust/crates/**/*.rs
    pattern-regex: "\\btodo!\\b"

  - id: rust-no-unimplemented-macro
    message: Do not commit unimplemented! placeholders.
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - rust/crates/**/*.rs
    pattern-regex: "\\bunimplemented!\\b"

  - id: rust-no-dbg-macro
    message: Do not commit dbg! calls.
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - rust/crates/**/*.rs
    pattern-regex: "\\bdbg!\\b"

  - id: shell-no-curl-pipe-sh
    message: Avoid curl|sh style shell execution in repo scripts.
    severity: ERROR
    languages: [bash]
    paths:
      include:
        - scripts/**/*.sh
        - .githooks/**
    patterns:
      - pattern-either:
          - pattern-regex: "curl[^\\n]*\\|[^\\n]*(sh|bash)"
          - pattern-regex: "wget[^\\n]*\\|[^\\n]*(sh|bash)"
