name: Aetower quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.19.0"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded branch and pull-request runs so contributors get fast
  # feedback, but never cancel a master run. Cancelling skips the "Post Cache"
  # steps, so a cancelled run saves nothing: with `true` here, pushing twice
  # in quick succession would leave the master cache permanently cold and the
  # gate would rebuild from scratch on every run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  quality:
    name: macOS 15 quality gate
    runs-on: macos-15
    # The gate runs the full Rust workspace test suite, the serialised
    # aetower-mcp suite, and the Swift suite, so a cold run is long. Bump
    # this if the gate outgrows it rather than letting runs be killed
    # mid-suite, which produces no diagnostic.
    timeout-minutes: 120

    steps:
      # Actions are pinned to commit SHAs, not mutable tags. Dependabot
      # (.github/dependabot.yml, package-ecosystem: github-actions) opens
      # the PRs that move these forward.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Without this every run recompiles ~260 crates plus the release FFI
      # dylib and re-resolves Sparkle from scratch. Cache keys are scoped by
      # the lockfile and toolchain so a dependency change invalidates them.
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # macos/Package.swift hardcodes macos/.build in its linker
          # unsafeFlags, so the gate must build there; caching that exact
          # path is what makes the Swift suite incremental.
          path: |
            macos/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved', 'macos/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # The version is read from rust-toolchain.toml rather than repeated
      # here, so there is a single source of truth. rustup auto-installs
      # the pinned toolchain on first use. The Swift version is printed too:
      # SwiftUI main-actor isolation diagnostics differ between toolchains, so
      # a build failure here is only diagnosable with the version in the log.
      - name: Report pinned toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "pinned rust toolchain: $channel"
          rustc --version
          cargo --version
          swift --version
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      # Cache just the version-pinned tool; keep its advisory database fetch fresh.
      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install quality tools
        run: |
          brew install gitleaks swiftlint semgrep shellcheck
          if ! command -v cargo-deny >/dev/null 2>&1 \
              || [ "$(cargo-deny --version)" != "cargo-deny $CARGO_DENY_VERSION" ]; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          fi
          cargo deny fetch db --config ../deny.toml
        working-directory: rust

      - name: Run the full local pre-push gate
        env:
          AETOWER_SKIP_DIRTY_WORKTREE_CONFIRM: "1"
        run: sh scripts/ci-local.sh --mode pre-push
