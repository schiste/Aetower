# Keeps the pinned Rust toolchain, the SwiftPM Sparkle dependency, and the
# GitHub Actions used by the quality gate current.
#
# Context: the 2026-06-03 cargo dependabot branch went stale and, if merged,
# would have removed aetower-policy and aetower-cli from the workspace because
# it was generated against an older rust/Cargo.toml. Dependabot is only useful
# when its PRs are reviewed against current main, so keep the cadence weekly
# rather than daily to limit PR volume.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group routine patch/minor bumps so 250 transitive deps do not produce
      # 250 PRs. Lockfile-only churn is handled by the groups below; anything
      # that changes a direct dependency version stays reviewable on its own.
      cargo-patch:
        update-types:
          - patch
      cargo-minor:
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: swift
    directory: /macos
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
